services:
  web:
    build: { context: ./web, dockerfile: Dockerfile }
    environment:
      APP_NAME: ${APP_NAME:-Matrix Synapse Dashboard}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?Set a persistent APP_KEY in .env}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ${APP_LOCALE:-fa}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dashboard}
      DB_USERNAME: ${DB_USERNAME:-dashboard}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CORE_BASE_URL: http://mx-core:8081
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:?Set CORE_SERVICE_TOKEN in .env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mx-core: { condition: service_healthy }
    ports: ["${WEB_PORT:-8080}:80"]
    restart: unless-stopped
  mx-core:
    build: ./core
    networks:
      - default
      - synapse_link
    environment:
      CORE_HTTP_ADDR: ":8081"
      MEDIA_GATE_ADDR: ":8082"
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:?Set CORE_SERVICE_TOKEN in .env}
      SYNAPSE_BASE_URL: ${SYNAPSE_BASE_URL:?Set SYNAPSE_BASE_URL in .env}
      SYNAPSE_ADMIN_USER: ${SYNAPSE_ADMIN_USER:-}
      SYNAPSE_ADMIN_PASSWORD: ${SYNAPSE_ADMIN_PASSWORD:-}
      SYNAPSE_ADMIN_TOKEN: ${SYNAPSE_ADMIN_TOKEN:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dashboard}
      DB_USERNAME: ${DB_USERNAME:-dashboard}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SYNAPSE_DB_URL: ${SYNAPSE_DB_URL:-}
      SYNAPSE_PROMETHEUS_URL: ${SYNAPSE_PROMETHEUS_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8081","8082"]
    ports: ["127.0.0.1:${MEDIA_GATE_PORT:-8082}:8082"]
    healthcheck: { test: ["CMD", "/mx-core", "healthcheck"], interval: 15s, timeout: 3s, retries: 5 }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dashboard}
      POSTGRES_USER: ${DB_USERNAME:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dashboard} -d ${DB_DATABASE:-dashboard}"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  postgres_data:
  redis_data:
networks:
  synapse_link:
    external: true
    name: ${SYNAPSE_DOCKER_NETWORK:-dashboard_synapse_link}
