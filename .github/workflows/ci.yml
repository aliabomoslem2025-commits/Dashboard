name: CI
on:
  push:
    branches: [main, matrix-synapse-dashboard]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Resolve Go dependencies
        working-directory: core
        run: go mod tidy
      - name: Test mx-core
        working-directory: core
        run: go test ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Vue application
        working-directory: web
        run: |
          npm install
          npm run build
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validate Composer configuration
        working-directory: web
        run: composer validate --no-check-publish
      - name: PHP syntax check
        working-directory: web
        run: |
          php -l artisan
          find app bootstrap config database public routes -name '*.php' -print0 | xargs -0 -n1 php -l

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=.*/APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-dashboard-password/' .env
          sed -i 's/^CORE_SERVICE_TOKEN=.*/CORE_SERVICE_TOKEN=ci-core-service-token/' .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build --pull
      - name: Start stack and smoke-test Laravel and Go
        run: |
          if ! docker compose up -d; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/login >/dev/null
          docker compose exec -T web php artisan migrate:status --no-interaction
          docker compose exec -T mx-core wget -qO- http://127.0.0.1:8081/health
      - name: Stop stack
        if: always()
        run: docker compose down -v
