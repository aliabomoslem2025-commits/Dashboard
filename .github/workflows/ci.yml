name: CI
on:
  push:
    branches: [main, matrix-synapse-dashboard, dockerized-toolchains]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Redis for Go integration tests
        run: docker run -d --name ci-redis -p 6379:6379 redis:7-alpine
      - name: Test mx-core inside Go container
        run: |
          docker run --rm --network host \
            -e REDIS_TEST_ADDR=127.0.0.1:6379 \
            -v "$PWD/core:/workspace" -w /workspace \
            golang:1.22-alpine sh -lc 'go mod tidy && go test ./...'
      - name: Stop Redis
        if: always()
        run: docker rm -f ci-redis || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Vue application inside Node container
        run: |
          docker run --rm -v "$PWD/web:/workspace" -w /workspace \
            node:22-alpine sh -lc 'npm install && npm run build'

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Composer and PHP inside containers
        run: |
          docker run --rm -v "$PWD/web:/app" -w /app composer:2 validate --no-check-publish
          docker run --rm -v "$PWD/web:/workspace" -w /workspace php:8.3-cli-alpine sh -lc \
            'php -l artisan && find app bootstrap config database public routes -name "*.php" -print0 | xargs -0 -n1 php -l'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=.*/APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-dashboard-password/' .env
          sed -i 's/^CORE_SERVICE_TOKEN=.*/CORE_SERVICE_TOKEN=ci-core-service-token/' .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build --pull
      - name: Start stack and smoke-test Laravel and Go
        run: |
          if ! docker compose up -d; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/login >/dev/null
          docker compose exec -T web php artisan migrate:status --no-interaction
          docker compose exec -T mx-core wget -qO- http://127.0.0.1:8081/health
      - name: Stop stack
        if: always()
        run: docker compose down -v
