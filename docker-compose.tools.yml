# Optional development toolchains. No language compiler/runtime is required on the host.
# Examples:
#   docker compose -f docker-compose.tools.yml run --rm go-toolchain go test ./...
#   docker compose -f docker-compose.tools.yml run --rm node-toolchain npm run build
#   docker compose -f docker-compose.tools.yml run --rm php-toolchain php -v
#   docker compose -f docker-compose.tools.yml run --rm composer-toolchain composer validate
services:
  go-toolchain:
    image: golang:1.22-alpine
    working_dir: /workspace
    volumes:
      - ./core:/workspace
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    entrypoint: ["go"]

  node-toolchain:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./web:/workspace
      - node_modules:/workspace/node_modules
      - npm_cache:/root/.npm
    entrypoint: ["npm"]

  php-toolchain:
    build:
      context: .
      dockerfile: tools/php/Dockerfile
    working_dir: /workspace
    volumes:
      - ./web:/workspace
    entrypoint: ["php"]

  composer-toolchain:
    image: composer:2
    working_dir: /workspace
    volumes:
      - ./web:/workspace
      - composer_cache:/tmp

volumes:
  go_modules:
  go_build_cache:
  node_modules:
  npm_cache:
  composer_cache:
